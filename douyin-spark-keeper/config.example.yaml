# ============================================
# 抖音自动续火花 配置文件
# 复制本文件为 config.yaml 后修改
# ============================================

# 每天发送时间,24 小时制 HH:MM
send_time: "21:30"

# 随机抖动分钟数:实际发送时间 = send_time ± jitter_minutes 内随机,
# 让每天的发送时间不完全固定,行为更自然。设 0 表示准点发送。
jitter_minutes: 30

# ------------------------------------------------
# 续火花目标好友列表
# name 必须与网页版会话列表里显示的名字一致(备注名或昵称)
# ------------------------------------------------
targets:
  - name: "好友昵称或备注A"
    # 可选:为该好友单独配置消息池(不填则用全局 messages)
    # messages:
    #   - "专属消息 {{friend}} 🔥"
  - name: "好友昵称或备注B"

# ------------------------------------------------
# 消息池:每次随机抽一条发送
# 支持占位符:{{friend}} 好友名 {{date}} 日期 {{time}} 时间 {{weekday}} 星期几
# ------------------------------------------------
messages:
  - "续火花啦 🔥 {{friend}}"
  - "今日份火花已续上 🔥"
  - "{{weekday}}快乐,火花不能断 🔥"
  - "打卡续火 🔥 {{date}}"

# ------------------------------------------------
# 浏览器设置
# ------------------------------------------------
# 无头模式。建议保持 false(有头窗口更不容易被风控,还能看到过程);
# 无人值守挂机时可改为 true
headless: false

# 浏览器通道:chrome / msedge / chromium
# 优先用本机安装的 Chrome,没有则自动尝试 Edge,最后用 Playwright 内置 Chromium
browser_channel: "chrome"

locale: "zh-CN"
timezone_id: "Asia/Shanghai"

# 每个好友发送失败后的重试次数
retry: 2

# 多个好友之间的随机间隔秒数范围
interval_seconds: [8, 20]

# 聊天页地址(一般不用改)
chat_url: "https://www.douyin.com/chat"
